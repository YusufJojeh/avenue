name: cPanel SSH Smoke Test

# Manual only. This never touches application code or the database — it just
# proves the GitHub -> cPanel SSH path works before deploy-production.yml is
# trusted with a real deploy.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke-test:
    name: Verify SSH access to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          set -Eeuo pipefail
          # Secrets occasionally pick up a stray trailing newline/space depending
          # on how they were set (e.g. `gh secret set X < file.txt`). Strip that
          # for single-line values. Never do this to SSH_KEY — it's a multi-line
          # PEM block and internal newlines are structural, not stray.
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Normalize the key defensively without ever printing its content:
          # 1) if the secret was pasted as a single line with literal "\n"
          #    (backslash-n text) instead of real line breaks — a common
          #    artifact of some copy/paste or secret-import paths — expand
          #    those into real newlines.
          # 2) strip CR characters (Windows line endings) — PEM/base64 never
          #    legitimately contains \r, so this is a pure fix either way.
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key.raw
          RAW_LINES=$(wc -l < ~/.ssh/deploy_key.raw)
          if [ "$RAW_LINES" -lt 2 ]; then
            echo "::warning::CPANEL_SSH_KEY has only $RAW_LINES real newline(s); a multi-line PEM key should have many. Expanding literal backslash-n sequences into real newlines."
            sed -i 's/\\r\\n/\n/g; s/\\n/\n/g' ~/.ssh/deploy_key.raw
          fi
          tr -d '\r' < ~/.ssh/deploy_key.raw > ~/.ssh/deploy_key
          printf '\n' >> ~/.ssh/deploy_key
          rm -f ~/.ssh/deploy_key.raw
          chmod 600 ~/.ssh/deploy_key

          echo "### SSH key structural diagnostics (never prints key content)"
          KEY_BYTES=$(wc -c < ~/.ssh/deploy_key)
          KEY_LINES=$(wc -l < ~/.ssh/deploy_key)
          echo "key file: $KEY_BYTES bytes, $KEY_LINES lines"
          FIRST_LINE=$(head -n1 ~/.ssh/deploy_key)
          LAST_LINE=$(tail -n2 ~/.ssh/deploy_key | head -n1)
          case "$FIRST_LINE" in
            -----BEGIN*-----) echo "first line looks like a PEM header: $FIRST_LINE";;
            *) echo "::warning::first line does not look like a PEM header (length: ${#FIRST_LINE} chars — not printed)";;
          esac
          case "$LAST_LINE" in
            -----END*-----) echo "last non-blank line looks like a PEM footer: $LAST_LINE";;
            *) echo "::warning::last non-blank line does not look like a PEM footer (length: ${#LAST_LINE} chars — not printed)";;
          esac

          # Presence-only marker check (grep -c only counts matching lines,
          # never prints their content) to tell apart "markers present but
          # something else is wrong" from "markers missing entirely".
          BEGIN_COUNT=$(grep -c '^-----BEGIN.*-----$' ~/.ssh/deploy_key || true)
          END_COUNT=$(grep -c '^-----END.*-----$' ~/.ssh/deploy_key || true)
          echo "PEM marker check: $BEGIN_COUNT BEGIN line(s), $END_COUNT END line(s) found (expect exactly 1 each)"

          if ssh-keygen -y -f ~/.ssh/deploy_key -P "" > /tmp/derived_pub.txt 2>/tmp/keygen_err.txt; then
            echo "ssh-keygen derived this public key from CPANEL_SSH_KEY (public keys are not secret):"
            cat /tmp/derived_pub.txt
            echo "^ Confirm this exact line is present in the server's ~/.ssh/authorized_keys for CPANEL_USER."
          else
            echo "::error::ssh-keygen could not parse CPANEL_SSH_KEY as a valid private key — see error below"
            cat /tmp/keygen_err.txt
            if [ "$BEGIN_COUNT" -eq 0 ] || [ "$END_COUNT" -eq 0 ]; then
              echo "::error::CPANEL_SSH_KEY is missing its -----BEGIN-----/-----END----- marker line(s). The secret likely has only the base64 body pasted in, not the full key file. It must be reset with the complete, unmodified private key file contents (including both marker lines)."
            fi
            exit 1
          fi

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan returned nothing — host/port unreachable or wrong"
            exit 1
          fi

      - name: Run remote smoke checks
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_PORT }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          sanitize() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          SSH_HOST="$(sanitize "$SSH_HOST")"
          SSH_PORT="$(sanitize "$SSH_PORT")"
          SSH_USER="$(sanitize "$SSH_USER")"
          DEPLOY_PATH="$(sanitize "$DEPLOY_PATH")"

          ssh_run() {
            ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                -o BatchMode=yes \
                "$SSH_USER@$SSH_HOST" "$1"
          }

          PUBLIC_HTML="/home/$SSH_USER/public_html"

          echo "### whoami / user identity"
          ssh_run "whoami" >/dev/null && echo "SSH OK"
          echo "USER OK"

          echo "### DEPLOY_PATH existence"
          ssh_run "test -d '$DEPLOY_PATH'" \
            && echo "DEPLOY_PATH OK" \
            || { echo "::error::DEPLOY_PATH does not exist on server (see repo secret DEPLOY_PATH)"; exit 1; }

          echo "### PHP"
          ssh_run "php -v" && echo "PHP OK"

          echo "### Composer"
          ssh_run "composer --version" && echo "COMPOSER OK"

          echo "### rsync"
          ssh_run "rsync --version | head -1" && echo "RSYNC OK"

          echo "### Node (informational only — build happens in GitHub Actions, not required remotely)"
          ssh_run "command -v node >/dev/null 2>&1 && node -v || echo 'node not present on server (fine, not required)'"

          echo "### .env vs legacy 'env' file (existence only, contents never read)"
          ssh_run "cd '$DEPLOY_PATH' && { test -f .env && echo '.env: present' || echo '.env: MISSING'; }"
          ssh_run "cd '$DEPLOY_PATH' && { test -f env && echo 'legacy env file: present (needs manual review, do not auto-rename)' || echo 'legacy env file: none found'; }"

          echo "### production index.php wiring (structure only, no secrets in this file)"
          ssh_run "test -f '$PUBLIC_HTML/index.php' && echo 'public_html/index.php: present' || echo 'public_html/index.php: MISSING'"
          ssh_run "grep -o \"repositories/avenue[^'\\\"]*\" '$PUBLIC_HTML/index.php' 2>/dev/null | sort -u || echo 'no repositories/avenue path reference found (review manually)'"

          echo "### storage symlink"
          ssh_run "if [ -L '$PUBLIC_HTML/storage' ]; then echo \"storage symlink present -> \$(readlink '$PUBLIC_HTML/storage')\"; else echo 'storage symlink: missing'; fi"

          echo "### public_html top-level contents (names only)"
          ssh_run "ls -1 '$PUBLIC_HTML'"

          echo "----------------------------------------"
          echo "SSH OK"
          echo "USER OK"
          echo "DEPLOY_PATH OK"
          echo "PHP OK"
          echo "COMPOSER OK"
          echo "RSYNC OK"
          echo "Smoke test completed. Review the log above for .env / index.php / storage-symlink findings before enabling production deploys."
