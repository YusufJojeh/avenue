name: cPanel SSH Smoke Test

# Manual only. This never touches application code or the database — it just
# proves the GitHub -> cPanel SSH path works before deploy-production.yml is
# trusted with a real deploy.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke-test:
    name: Verify SSH access to cPanel
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          set -Eeuo pipefail
          # Secrets occasionally pick up a stray trailing newline/space depending
          # on how they were set (e.g. `gh secret set X < file.txt`). Strip that
          # for single-line values. Never do this to SSH_KEY — it's a multi-line
          # PEM block and internal newlines are structural, not stray.
          SSH_HOST="$(printf '%s' "$SSH_HOST" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          SSH_PORT="$(printf '%s' "$SSH_PORT" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Normalize the key defensively without ever printing its content:
          # 1) if the secret was pasted as a single line with literal "\n"
          #    (backslash-n text) instead of real line breaks — a common
          #    artifact of some copy/paste or secret-import paths — expand
          #    those into real newlines.
          # 2) strip CR characters (Windows line endings) — PEM/base64 never
          #    legitimately contains \r, so this is a pure fix either way.
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key.raw
          RAW_LINES=$(wc -l < ~/.ssh/deploy_key.raw)
          if [ "$RAW_LINES" -lt 2 ]; then
            echo "::warning::CPANEL_SSH_KEY has only $RAW_LINES real newline(s); a multi-line PEM key should have many. Expanding literal backslash-n sequences into real newlines."
            sed -i 's/\\r\\n/\n/g; s/\\n/\n/g' ~/.ssh/deploy_key.raw
          fi
          tr -d '\r' < ~/.ssh/deploy_key.raw > ~/.ssh/deploy_key
          printf '\n' >> ~/.ssh/deploy_key
          rm -f ~/.ssh/deploy_key.raw
          chmod 600 ~/.ssh/deploy_key

          echo "### SSH key structural diagnostics (never prints key content)"
          KEY_BYTES=$(wc -c < ~/.ssh/deploy_key)
          KEY_LINES=$(wc -l < ~/.ssh/deploy_key)
          echo "key file: $KEY_BYTES bytes, $KEY_LINES lines"
          FIRST_LINE=$(head -n1 ~/.ssh/deploy_key)
          LAST_LINE=$(tail -n2 ~/.ssh/deploy_key | head -n1)
          case "$FIRST_LINE" in
            -----BEGIN*-----) echo "first line looks like a PEM header: $FIRST_LINE";;
            *) echo "::warning::first line does not look like a PEM header (length: ${#FIRST_LINE} chars — not printed)";;
          esac
          case "$LAST_LINE" in
            -----END*-----) echo "last non-blank line looks like a PEM footer: $LAST_LINE";;
            *) echo "::warning::last non-blank line does not look like a PEM footer (length: ${#LAST_LINE} chars — not printed)";;
          esac

          # Presence-only marker check (grep -c only counts matching lines,
          # never prints their content) to tell apart "markers present but
          # something else is wrong" from "markers missing entirely".
          BEGIN_COUNT=$(grep -c '^-----BEGIN.*-----$' ~/.ssh/deploy_key || true)
          END_COUNT=$(grep -c '^-----END.*-----$' ~/.ssh/deploy_key || true)
          echo "PEM marker check: $BEGIN_COUNT BEGIN line(s), $END_COUNT END line(s) found (expect exactly 1 each)"

          # If CPANEL_SSH_KEY is passphrase-protected, strip the passphrase
          # now so every later `ssh -i ~/.ssh/deploy_key` call (which relies
          # on BatchMode=yes and cannot prompt) can use it directly. The
          # decrypted key only ever exists on this ephemeral runner. Mirrors
          # the fix already applied in deploy-production.yml.
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            if ! ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f ~/.ssh/deploy_key > /tmp/keygen_strip.txt 2>&1; then
              echo "::error::CPANEL_SSH_KEY_PASSPHRASE did not unlock CPANEL_SSH_KEY — see error below"
              cat /tmp/keygen_strip.txt
              exit 1
            fi
          fi

          if ssh-keygen -y -f ~/.ssh/deploy_key -P "" > /tmp/derived_pub.txt 2>/tmp/keygen_err.txt; then
            echo "ssh-keygen derived this public key from CPANEL_SSH_KEY (public keys are not secret):"
            cat /tmp/derived_pub.txt
            echo "^ Confirm this exact line is present in the server's ~/.ssh/authorized_keys for CPANEL_USER."
          else
            echo "::error::ssh-keygen could not parse CPANEL_SSH_KEY as a valid private key — see error below"
            cat /tmp/keygen_err.txt
            if [ "$BEGIN_COUNT" -eq 0 ] || [ "$END_COUNT" -eq 0 ]; then
              echo "::error::CPANEL_SSH_KEY is missing its -----BEGIN-----/-----END----- marker line(s). The secret likely has only the base64 body pasted in, not the full key file. It must be reset with the complete, unmodified private key file contents (including both marker lines)."
            fi
            exit 1
          fi

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -T 15 -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan returned nothing — host/port unreachable or wrong"
            exit 1
          fi

      - name: Run remote smoke checks
        env:
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_PORT }}
          SSH_USER: ${{ secrets.CPANEL_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          sanitize() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          SSH_HOST="$(sanitize "$SSH_HOST")"
          SSH_PORT="$(sanitize "$SSH_PORT")"
          SSH_USER="$(sanitize "$SSH_USER")"
          DEPLOY_PATH="$(sanitize "$DEPLOY_PATH")"

          # Reuse one authenticated connection for every check below instead
          # of opening a fresh TCP+SSH handshake per command. Several cPanel
          # hosts run connection-rate protection (cPHulk/CSF) that treats a
          # burst of brand-new SSH connections from one IP as suspicious even
          # when every one authenticates correctly — multiplexing avoids
          # tripping that entirely, and is faster besides.
          mkdir -p ~/.ssh/control
          CONTROL_PATH=~/.ssh/control/%r@%h:%p
          cleanup_control() {
            ssh -o ControlPath="$CONTROL_PATH" -O exit "$SSH_USER@$SSH_HOST" 2>/dev/null || true
          }
          trap cleanup_control EXIT

          ssh_run() {
            ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
                -o UserKnownHostsFile=~/.ssh/known_hosts \
                -o BatchMode=yes \
                -o ControlMaster=auto -o ControlPersist=60s -o ControlPath="$CONTROL_PATH" \
                "$SSH_USER@$SSH_HOST" "$1"
          }

          PUBLIC_HTML="/home/$SSH_USER/public_html"

          echo "### whoami / user identity"
          if ! WHOAMI_OUTPUT=$(ssh_run "whoami" 2>&1); then
            echo "::error::SSH authentication was rejected by the server (publickey method failed). CPANEL_SSH_KEY parses correctly (confirmed above) and the host/port are reachable, so the private key itself is fine — this means its matching PUBLIC key is not currently authorized for CPANEL_USER on the server."
            echo "::error::In cPanel: SSH Access -> Manage SSH Keys -> find this key -> Manage Authorization -> Authorize. Then re-run this workflow."
            echo "::error::Raw SSH error: $WHOAMI_OUTPUT"
            exit 1
          fi
          echo "SSH OK (remote whoami: $WHOAMI_OUTPUT)"
          echo "USER OK"

          echo "### DEPLOY_PATH existence"
          if ssh_run "test -d '$DEPLOY_PATH'"; then
            echo "DEPLOY_PATH OK"
          else
            echo "::error::DEPLOY_PATH does not exist on server (see repo secret DEPLOY_PATH)"
            # Read-only cross-check against the known documented application
            # path (not derived from the secret) to tell apart "the secret
            # value is wrong" from "the directory genuinely isn't there yet".
            KNOWN_PATH="/home/$SSH_USER/repositories/avenue"
            if ssh_run "test -d '$KNOWN_PATH'"; then
              echo "::error::However, '$KNOWN_PATH' DOES exist on the server. The DEPLOY_PATH secret likely has a typo, wrong case, or stray whitespace/slash — compare it against this exact path."
            else
              echo "::error::'$KNOWN_PATH' also does not exist on the server. This looks like a genuinely fresh target, not a secret typo."
            fi
            ssh_run "ls -la '/home/$SSH_USER/' 2>&1 | head -30"
            ssh_run "ls -la '/home/$SSH_USER/repositories/' 2>&1 | head -30 || echo 'no repositories/ directory under home'"
            exit 1
          fi

          echo "### PHP"
          ssh_run "php -v" && echo "PHP OK"

          echo "### Composer"
          ssh_run "composer --version" && echo "COMPOSER OK"

          echo "### rsync"
          ssh_run "rsync --version | head -1" && echo "RSYNC OK"

          echo "### Node (informational only — build happens in GitHub Actions, not required remotely)"
          ssh_run "command -v node >/dev/null 2>&1 && node -v || echo 'node not present on server (fine, not required)'"

          echo "### .env vs legacy 'env' file (existence only, contents never read)"
          ssh_run "cd '$DEPLOY_PATH' && { test -f .env && echo '.env: present' || echo '.env: MISSING'; }"
          ssh_run "cd '$DEPLOY_PATH' && { test -f env && echo 'legacy env file: present (needs manual review, do not auto-rename)' || echo 'legacy env file: none found'; }"

          echo "### application checkout sanity"
          ssh_run "test -f '$DEPLOY_PATH/artisan' && echo 'artisan: present' || echo 'artisan: MISSING'"
          ssh_run "test -f '$DEPLOY_PATH/vendor/autoload.php' && echo 'vendor/autoload.php: present' || echo 'vendor/autoload.php: MISSING (expected before the first composer install)'"

          echo "### production index.php wiring (structure only, no secrets in this file)"
          ssh_run "test -f '$PUBLIC_HTML/index.php' && echo 'public_html/index.php: present' || echo 'public_html/index.php: MISSING'"
          ssh_run "grep -o \"repositories/avenue[^'\\\"]*\" '$PUBLIC_HTML/index.php' 2>/dev/null | sort -u || echo 'no repositories/avenue path reference found (review manually)'"

          echo "### storage symlink"
          ssh_run "if [ -L '$PUBLIC_HTML/storage' ]; then echo \"storage symlink present -> \$(readlink '$PUBLIC_HTML/storage')\"; else echo 'storage symlink: missing'; fi"

          echo "### public_html top-level contents (names only)"
          ssh_run "ls -1 '$PUBLIC_HTML'"

          echo "### storage/app/public/categories contents and permissions"
          ssh_run "cd '$DEPLOY_PATH' && { test -d storage/app/public/categories && ls -la storage/app/public/categories | tail -20 || echo 'categories/ directory MISSING under storage/app/public'; }"
          ssh_run "cd '$DEPLOY_PATH' && stat -c '%U:%G %a %n' storage storage/app storage/app/public storage/app/public/categories 2>&1 || true"

          echo "### specific known test files"
          ssh_run "cd '$DEPLOY_PATH' && find storage/app/public/categories -type f -iname '*663481f4b76ea7b37b97ebb8*' -exec ls -la {} \; 2>&1 || echo 'not found'"
          ssh_run "cd '$DEPLOY_PATH' && find storage/app/public/categories -type f -iname '*75f081fa8b8e6b9b9cf34469*' -exec ls -la {} \; 2>&1 || echo 'not found'"

          echo "### LiteSpeed / web-server direct filesystem read check via public_html/storage"
          ssh_run "ls -la '$PUBLIC_HTML/storage/categories' 2>&1 | tail -20 || echo 'cannot list public_html/storage/categories'"

          echo "### public_html/.htaccess (no secrets in this file, routing rules only)"
          ssh_run "cat '$PUBLIC_HTML/.htaccess' 2>&1 || echo 'no .htaccess at public_html root'"

          echo "### public_html/storage lstat vs stat (symlink resolution)"
          ssh_run "cd '$PUBLIC_HTML' && stat storage 2>&1"
          ssh_run "cd '$PUBLIC_HTML' && stat -L storage/categories/file-00000000663481f4b76ea7b37b97ebb8_2026-09-22_16-24-14_g0cJ0UKh.png 2>&1 || echo 'stat -L via public_html/storage FAILED'"

          echo "### trigger a fresh 404 then check for a web-server-level explanation"
          curl -sS -o /dev/null "https://avenuebrand.online/storage/categories/file-00000000663481f4b76ea7b37b97ebb8_2026-09-22_16-24-14_g0cJ0UKh.png" || true
          ssh_run "find /home/\$(whoami)/logs -maxdepth 1 -iname '*avenuebrand*' -o -iname '*error*' 2>/dev/null | head -20"
          ssh_run "for f in /home/\$(whoami)/logs/*error*; do [ -f \"\$f\" ] && echo \"--- \$f ---\" && tail -15 \"\$f\"; done 2>&1 || echo 'no per-account error logs found under ~/logs'"

          echo "### open_basedir / symlink protection hints from phpinfo (cli, informational)"
          ssh_run "php -i 2>/dev/null | grep -i 'open_basedir\|symlink' || echo 'no relevant php.ini directives found via cli'"

          echo "### isolate: does ANY request crossing the public_html/storage symlink get served statically?"
          ssh_run "cd '$PUBLIC_HTML' && echo diagnostic-probe > storage-symlink-probe.txt 2>&1"
          curl -sS -o /dev/null -w 'control - real file at public_html root: HTTP %{http_code}\n' "https://avenuebrand.online/storage-symlink-probe.txt" || true
          ssh_run "cd '$PUBLIC_HTML/storage' && echo diagnostic-probe > probe-through-symlink.txt 2>&1"
          curl -sS -o /dev/null -w 'test - file written through storage symlink: HTTP %{http_code}\n' "https://avenuebrand.online/storage/probe-through-symlink.txt" || true
          ssh_run "cd '$PUBLIC_HTML' && rm -f storage-symlink-probe.txt"
          ssh_run "cd '$PUBLIC_HTML/storage' && rm -f probe-through-symlink.txt"

          echo "### tail of storage/logs/laravel.log (last 40 lines, for new errors only)"
          ssh_run "cd '$DEPLOY_PATH' && { test -f storage/logs/laravel.log && tail -40 storage/logs/laravel.log || echo 'no storage/logs/laravel.log found'; }"

          echo "----------------------------------------"
          echo "SSH OK"
          echo "USER OK"
          echo "DEPLOY_PATH OK"
          echo "PHP OK"
          echo "COMPOSER OK"
          echo "RSYNC OK"
          echo "Smoke test completed. Review the log above for .env / index.php / storage-symlink findings before enabling production deploys."
