name: Deploy to Production

# GitHub Actions is the source of truth for what gets deployed: it checks out
# the exact commit that triggered the run, tests it, builds it, and pushes
# that artifact to cPanel over SSH/rsync. The server never pulls from git
# itself — this keeps deploys deterministic.
on:
  push:
    branches:
      - master
  workflow_dispatch: {}

concurrency:
  group: avenue-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Test, build, and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------
      # Pre-flight: PHP tests
      # ---------------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, gd, bcmath, zip, pdo_mysql, pdo_sqlite
          coverage: none

      - name: Validate composer.json/composer.lock
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies (incl. dev, for the test suite)
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare testing environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run PHP test suite
        run: php artisan test

      # ---------------------------------------------------------------
      # Pre-flight: frontend build (Vite)
      # ---------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify build output exists
        run: test -f public/build/manifest.json

      # ---------------------------------------------------------------
      # SSH setup
      # ---------------------------------------------------------------
      - name: Load and sanitize cPanel connection config
        env:
          RAW_HOST: ${{ secrets.CPANEL_HOST }}
          RAW_PORT: ${{ secrets.CPANEL_PORT }}
          RAW_USER: ${{ secrets.CPANEL_USER }}
          RAW_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -Eeuo pipefail
          # Secrets occasionally pick up a stray trailing newline/space depending
          # on how they were set (e.g. `gh secret set X < file.txt`). Strip that
          # for these single-line values before they're used anywhere. Written
          # to GITHUB_ENV, never echoed, so nothing here appears in the log.
          sanitize() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          {
            echo "CPANEL_HOST_S=$(sanitize "$RAW_HOST")"
            echo "CPANEL_PORT_S=$(sanitize "$RAW_PORT")"
            echo "CPANEL_USER_S=$(sanitize "$RAW_USER")"
            echo "DEPLOY_PATH_S=$(sanitize "$RAW_PATH")"
          } >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_KEY_PASSPHRASE: ${{ secrets.CPANEL_SSH_KEY_PASSPHRASE }}
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Normalize the key defensively without ever printing its content:
          # 1) if the secret was pasted as a single line with literal "\n"
          #    (backslash-n text) instead of real line breaks, expand those
          #    into real newlines.
          # 2) strip CR characters (Windows line endings) — PEM/base64 never
          #    legitimately contains \r, so this is a pure fix either way.
          printf '%s' "$SSH_KEY" > ~/.ssh/deploy_key.raw
          RAW_LINES=$(wc -l < ~/.ssh/deploy_key.raw)
          if [ "$RAW_LINES" -lt 2 ]; then
            sed -i 's/\\r\\n/\n/g; s/\\n/\n/g' ~/.ssh/deploy_key.raw
          fi
          tr -d '\r' < ~/.ssh/deploy_key.raw > ~/.ssh/deploy_key
          printf '\n' >> ~/.ssh/deploy_key
          rm -f ~/.ssh/deploy_key.raw
          chmod 600 ~/.ssh/deploy_key

          # If CPANEL_SSH_KEY is passphrase-protected, strip the passphrase
          # now so every later `ssh -i ~/.ssh/deploy_key` call (which relies
          # on BatchMode=yes and cannot prompt) can use it directly. The
          # decrypted key only ever exists on this ephemeral runner.
          if [ -n "$SSH_KEY_PASSPHRASE" ]; then
            if ! ssh-keygen -p -P "$SSH_KEY_PASSPHRASE" -N "" -f ~/.ssh/deploy_key > /tmp/keygen_strip.txt 2>&1; then
              echo "::error::CPANEL_SSH_KEY_PASSPHRASE did not unlock CPANEL_SSH_KEY — see error below"
              cat /tmp/keygen_strip.txt
              exit 1
            fi
          fi

          if ! ssh-keygen -y -f ~/.ssh/deploy_key -P "" > /dev/null 2>/tmp/keygen_err.txt; then
            echo "::error::CPANEL_SSH_KEY could not be parsed as a valid private key — see error below"
            cat /tmp/keygen_err.txt
            exit 1
          fi

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -T 15 -p "$CPANEL_PORT_S" -H "$CPANEL_HOST_S" >> ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan returned nothing — aborting before touching production"
            exit 1
          fi

          # Establish one multiplexed connection for the whole job instead of
          # a fresh TCP+SSH handshake per later step. Some cPanel hosts run
          # connection-rate protection (cPHulk/CSF) that can flag a burst of
          # brand-new connections from one IP even when each authenticates
          # correctly. ControlPersist keeps this alive in the background for
          # the rest of the job; the runner VM is destroyed afterwards, so no
          # explicit teardown is needed.
          echo "SSH_CONTROL_PATH=$HOME/.ssh/cm_socket" >> "$GITHUB_ENV"
          ssh -i ~/.ssh/deploy_key -p "$CPANEL_PORT_S" \
              -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes \
              -o ControlMaster=yes -o ControlPersist=15m -o ControlPath="$HOME/.ssh/cm_socket" \
              -fN "$CPANEL_USER_S@$CPANEL_HOST_S"

      # ---------------------------------------------------------------
      # Pre-flight: refuse to deploy onto a broken .env setup
      # ---------------------------------------------------------------
      - name: Verify production .env is sane (existence only, never read contents)
        run: |
          set -Eeuo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -p $CPANEL_PORT_S -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes -o ControlPath=$SSH_CONTROL_PATH $CPANEL_USER_S@$CPANEL_HOST_S"

          HAS_DOTENV=$($SSH "cd '$DEPLOY_PATH_S' && test -f .env && echo yes || echo no")
          HAS_LEGACY_ENV=$($SSH "cd '$DEPLOY_PATH_S' && test -f env && echo yes || echo no")

          if [ "$HAS_DOTENV" = "no" ] && [ "$HAS_LEGACY_ENV" = "yes" ]; then
            echo "::error::Production .env configuration requires correction."
            echo "A file literally named 'env' exists at DEPLOY_PATH but '.env' does not."
            echo "This will NOT be auto-renamed. Fix it manually on the server, then re-run."
            exit 1
          fi

          if [ "$HAS_DOTENV" = "no" ]; then
            echo "::error::Production .env configuration requires correction."
            echo "No .env file found at DEPLOY_PATH — Laravel cannot boot without it. Refusing to deploy."
            exit 1
          fi

          echo ".env present on server — continuing."

      # ---------------------------------------------------------------
      # Ship the exact checked-out commit to the application directory
      # ---------------------------------------------------------------
      - name: Sync application code to DEPLOY_PATH
        run: |
          set -Eeuo pipefail
          # Every exclude below is root-anchored (leading /) so it only matches
          # at the top of the transfer tree. An earlier unanchored 'vendor/'
          # pattern also matched public/vendor/orchid/ at any depth, silently
          # stripping Orchid's admin assets out of every deploy — that's what
          # caused the "Mix manifest not found" production error. Composer
          # deps are still excluded (the server runs its own composer install
          # below); public/vendor/orchid/ is application-owned and must ship.
          rsync -az --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -p $CPANEL_PORT_S -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes -o ControlPath=$SSH_CONTROL_PATH" \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.claude/' \
            --exclude='/node_modules/' \
            --exclude='/vendor/' \
            --exclude='/storage/' \
            --exclude='/tests/' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.phpunit.result.cache' \
            ./ "$CPANEL_USER_S@$CPANEL_HOST_S:$DEPLOY_PATH_S/"

      # ---------------------------------------------------------------
      # Server-side: dependencies, migrations, cache (maintenance-mode wrapped)
      # ---------------------------------------------------------------
      - name: Install server-side Composer dependencies, migrate, and cache
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "$CPANEL_PORT_S" \
              -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes -o ControlPath="$SSH_CONTROL_PATH" \
              "$CPANEL_USER_S@$CPANEL_HOST_S" bash -s -- "$DEPLOY_PATH_S" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          DEPLOY_PATH="$1"
          cd "$DEPLOY_PATH"

          APP_DOWN=0
          cleanup() {
            if [ "$APP_DOWN" = "1" ]; then
              php artisan up || true
            fi
          }
          trap cleanup EXIT

          echo "==> composer install (no-dev, production)"
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

          echo "==> publishing Orchid admin assets"
          php artisan orchid:publish
          if [ ! -f "public/vendor/orchid/mix-manifest.json" ]; then
            echo "::error::public/vendor/orchid/mix-manifest.json missing after orchid:publish"
            exit 1
          fi

          echo "==> maintenance mode on"
          php artisan down || true
          APP_DOWN=1

          echo "==> database migrations"
          php artisan migrate --force

          echo "==> cache optimization"
          php artisan optimize:clear
          php artisan config:cache
          php artisan view:cache
          # route:cache intentionally NOT run here: Orchid's dynamic platform
          # screens/menus have not yet been verified compatible with cached
          # routes. Enable deliberately (see docs/deployment.md) once verified.

          echo "==> storage/bootstrap-cache permissions (least privilege, no 777)"
          find storage bootstrap/cache -type d -exec chmod 775 {} \;
          find storage bootstrap/cache -type f -exec chmod 664 {} \;

          echo "==> storage symlink (idempotent, never overwrites an existing one)"
          PUBLIC_HTML="/home/$(whoami)/public_html"
          if [ ! -e "$PUBLIC_HTML/storage" ]; then
            ln -s "$DEPLOY_PATH/storage/app/public" "$PUBLIC_HTML/storage"
            echo "storage symlink created"
          else
            echo "storage symlink/dir already present — left untouched"
          fi

          echo "==> maintenance mode off"
          php artisan up
          APP_DOWN=0
          REMOTE_SCRIPT

      - name: Record deployed commit
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "$CPANEL_PORT_S" \
              -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes -o ControlPath="$SSH_CONTROL_PATH" \
              "$CPANEL_USER_S@$CPANEL_HOST_S" \
              "echo '$GITHUB_SHA' > '$DEPLOY_PATH_S/.deployed_commit'"

      # ---------------------------------------------------------------
      # Public web root: allowlisted, non-destructive static asset sync
      # ---------------------------------------------------------------
      - name: Sync public assets into public_html (allowlist only)
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "$CPANEL_PORT_S" \
              -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes -o ControlPath="$SSH_CONTROL_PATH" \
              "$CPANEL_USER_S@$CPANEL_HOST_S" bash -s -- "$DEPLOY_PATH_S" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          DEPLOY_PATH="$1"
          PUBLIC_HTML="/home/$(whoami)/public_html"
          APP_PUBLIC="$DEPLOY_PATH/public"

          echo "==> build/ (fully Vite-generated — safe to mirror exactly)"
          mkdir -p "$PUBLIC_HTML/build"
          rsync -a --delete "$APP_PUBLIC/build/" "$PUBLIC_HTML/build/"

          echo "==> vendor/orchid/ (published by orchid:publish — safe to mirror exactly)"
          if [ ! -f "$APP_PUBLIC/vendor/orchid/mix-manifest.json" ]; then
            echo "::error::public/vendor/orchid/mix-manifest.json missing on server — refusing to sync a broken Orchid asset set"
            exit 1
          fi
          mkdir -p "$PUBLIC_HTML/vendor/orchid"
          rsync -a --delete "$APP_PUBLIC/vendor/orchid/" "$PUBLIC_HTML/vendor/orchid/"

          echo "==> allowlisted app-owned static directories (additive only, no deletion)"
          for dir in brand css js images; do
            if [ -d "$APP_PUBLIC/$dir" ]; then
              mkdir -p "$PUBLIC_HTML/$dir"
              rsync -a "$APP_PUBLIC/$dir/" "$PUBLIC_HTML/$dir/"
            fi
          done

          echo "==> allowlisted app-owned static files"
          for f in favicon.ico robots.txt; do
            if [ -f "$APP_PUBLIC/$f" ]; then
              cp "$APP_PUBLIC/$f" "$PUBLIC_HTML/$f"
            fi
          done

          echo "Public asset sync complete. .htaccess, .well-known/, and anything"
          echo "else in public_html not listed above was intentionally left untouched."
          REMOTE_SCRIPT

      # ---------------------------------------------------------------
      # Post-deploy verification: storage symlink must be exactly right
      # ---------------------------------------------------------------
      - name: Verify storage symlink target
        run: |
          set -Eeuo pipefail
          ssh -i ~/.ssh/deploy_key -p "$CPANEL_PORT_S" \
              -o UserKnownHostsFile=~/.ssh/known_hosts -o BatchMode=yes -o ControlPath="$SSH_CONTROL_PATH" \
              "$CPANEL_USER_S@$CPANEL_HOST_S" bash -s -- "$DEPLOY_PATH_S" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          DEPLOY_PATH="$1"
          PUBLIC_HTML="/home/$(whoami)/public_html"
          EXPECTED="$DEPLOY_PATH/storage/app/public"
          ACTUAL="$(readlink "$PUBLIC_HTML/storage" || true)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::storage symlink is wrong: expected '$EXPECTED', found '$ACTUAL'"
            exit 1
          fi
          echo "storage symlink OK -> $ACTUAL"
          REMOTE_SCRIPT

      # ---------------------------------------------------------------
      # Health check
      # ---------------------------------------------------------------
      - name: Health check production site
        run: |
          set -Eeuo pipefail
          for path in / /en /admin/login; do
            echo "==> checking https://avenuebrand.online${path}"
            curl --fail --show-error --location \
                 --retry 3 --retry-delay 5 --max-time 30 \
                 "https://avenuebrand.online${path}" -o /dev/null
          done

      - name: Deployment summary
        run: |
          echo "Deployment successful"
          echo "deployment commit: $GITHUB_SHA"
